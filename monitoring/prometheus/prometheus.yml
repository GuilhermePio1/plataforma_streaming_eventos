# ============================================================
# Prometheus - Configuração de Scraping
# Plataforma de Streaming de Eventos
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ============================================================
# Scrape Configs
# ============================================================
scrape_configs:

  # ----------------------------------------------------------
  # Observabilidade Base
  # ----------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    # A porta 8888 expõe as métricas internas do próprio Collector
    static_configs:
        - targets: ["otel-collector:8888"]

  # ----------------------------------------------------------
  # Infraestrutura (Requer adição dos exporters no Compose)
  # ----------------------------------------------------------
  - job_name: "kafka"
    static_configs:
      # Assume o uso do kafka-exporter rodando na porta 9308
      - targets: ["kafka-exporter:9308"]
        labels:
          component: "mensageria"

  - job_name: "postgresql"
    static_configs:
      # Assume o uso do postgres_exporter rodando na porta 9187
      - targets: ["postgres_exporter:9187"]
        labels:
          component: "banco-de-dados"

  - job_name: "redis"
    static_configs:
      # Assume o uso do redis_exporter rodando na porta 9121
      - targets: ["redis_exporter:9121"]
        labels:
          component: "cache"

  # ----------------------------------------------------------
  # Microsserviços da Plataforma (Spring Boot Actuator)
  # ----------------------------------------------------------
  - job_name: "ingestion-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["ingestion-service:8081"]
        labels:
          service: "ingestion-service"
          team: "streaming"

  - job_name: "stream-processing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["stream-processing-service:8081"]
        labels:
          service: "stream-processing-service"
          team: "streaming"

  - job_name: "persistence-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["persistence-service:8081"]
        labels:
          service: "persistence-service"
          team: "streaming"

  - job_name: "query-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["query-service:8081"]
        labels:
          service: "query-service"
          team: "streaming"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8081"]
        labels:
          service: "notification-service"
          team: "streaming"